# Install as /etc/nginx/conf.d/compare-ai.conf after replacing server_name.
# TLS should terminate in this server (or at a trusted upstream proxy).
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    root /var/www/compare-ai/current/dist;
    index index.html;
    client_max_body_size 1m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /robots.txt { proxy_pass http://127.0.0.1:3001; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:3001; }
    location = /llms.txt { proxy_pass http://127.0.0.1:3001; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:3001; }
    location ^~ /r/ { proxy_pass http://127.0.0.1:3001; }
    location ^~ /compare/ { proxy_pass http://127.0.0.1:3001; }
    location ^~ /og/ { proxy_pass http://127.0.0.1:3001; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|webp)$ {
        try_files $uri =404;
        expires 1y;
    }
}

# Keep the receiver private; expose only this proxied endpoint over HTTPS in production.
server {
    listen 127.0.0.1:9001;
    server_name webhook.invalid;

    client_max_body_size 1m;
    location = /webhook {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { return 404; }
}
